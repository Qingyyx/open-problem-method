name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Run structural gates
        run: python3 scripts/check.py --all
      - name: Test the gates themselves
        run: python3 scripts/test_gates.py
      # 行为 eval 需要模型额度，是发布前本地门禁 make eval，不进默认 CI。
