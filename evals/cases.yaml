cases:
  - id: case-01
    input: '帮我找北京好的学区房'
    expect: '定位缺失 + 实例化'
    must_match:
      - '划片|政策原文|入学政策'
      - '(预算|通勤|孩子)'
    must_not_match: []
    why: '多缺口共存时不得只贴一个标签'

  - id: case-02
    input: '我想找个隔音好的房子，怎么判断？'
    expect: '定位缺失'
    must_match:
      - '(GB\s*55038|GB\s*55016|GB\s*50118)'
      - '(Ln,w|L.nT,w|DnT,w|撞击声)'
      - '\d+\s*dB'
    must_not_match: []
    why: '定位门禁必须落到标准号+数值'

  - id: case-03
    input: '我该不该辞职去做独立开发？'
    expect: '证据缺失 + 不可逆分支'
    must_match:
      - '(参照类|base rate|基准)'
      - '(可逆|最小步|在职|兼职|副业)'
      - '(止损|收入下限|触发线|停止条件)'
    must_not_match: []
    why: '不可逆决策不能拿决策本身当实验'

  - id: case-04
    input: '帮我设计一个评测 agent 长上下文能力的 benchmark'
    expect: '生成缺失 + 证据门禁'
    must_match:
      - '(强|弱).{0,12}(模型|基线)|(中间物|对照|消融|ablation|2[×x]2|标准误)'
      - '(捷径|污染|作弊|干扰|区分度|判别力)'
      - '(否决条件|否决|淘汰条件)'
    must_not_match: []
    why: '生成类必须有判别力证据，不能只交矩阵'

  - id: case-05
    input: '我们该不该把 Postgres 换成 ClickHouse？'
    expect: '定位缺失 + 强制实例化'
    must_match:
      - '(QPS|TPS|OLTP|OLAP|事务|并发|吞吐|rows|行数|数据量|延迟)'
      - '(未判|未闭合|缺.{0,4}(数值|数据)|待.{0,4}(提供|确认))'
    must_not_match: []
    why: '给推荐前必须先出可判定私有约束'

  - id: case-06
    input: '我怎么知道我的产品有没有 PMF？'
    expect: '证据缺失'
    must_match:
      - '\d+\s*%'
      - '(留存|付费|失望)'
    must_not_match: []
    why: '通用三件套不是门禁'

  - id: case-07
    input: '帮我把"Python 的 list 和 tuple 有什么区别"拆解一下'
    expect: '定位缺失（已闭合），直接回答'
    must_match:
      - '(可变|不可变|immutable)'
      - '(tuple|list)'
    must_not_match:
      - '\|\s*#\s*\|\s*缺口'
      - '(路径一|路径二|方案一|方案二)'
    why: '门禁一次闭合且无私有条件时直接回答；拆解本身不是交付物'

  - id: case-08
    input: '用 open-problem 帮我拆解：我们团队该不该把单体拆成微服务？'
    expect: '过程文档，7 节齐全'
    artifact_glob: 'open-problem-*.md'
    must_match:
      - '^# '
      - '^## 1\.'
      - '^## 2\.'
      - '^## 3\.'
      - '^## 4\.'
      - '^## 5\.'
      - '^## 6\.'
      - '^## 7\.'
      - '(P0|探针)'
      - '缺口台账'
      - '下一步'
      - '执行记录'
    must_not_match: []
    why: '产出是过程文档；每一步一个二级标题，只给最终结论不算完成'
